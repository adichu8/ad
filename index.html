<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1a0505;cursor:none}
  body{user-select:none;-webkit-user-select:none}
  canvas{position:fixed;inset:0;display:block}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(() => {
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const SCENE = ['#ff1a1a', '#ff0000', '#cc0000', '#ff3333', '#aa0000', '#ff4444'];
const SPD = 360, ACC = 6.2, LEAD = 1.2, DASH = 1050, STABCD = 0.36;
const STAB_RANGE = 52, MAXHP = 8;
const stage = document.getElementById('stage');
let ctx = stage.getContext('2d');
const view = ctx;
const dc = document.createElement('canvas'), dctx = dc.getContext('2d');
const JB = 380, SCALE = 1.3;
const jbuf = document.createElement('canvas'), jbx = jbuf.getContext('2d');
let W = 0, H = 0, DPR = Math.min(2, window.devicePixelRatio || 1);
function resize() {
  const keep = document.createElement('canvas');
  if (dc.width) { keep.width = dc.width; keep.height = dc.height; keep.getContext('2d').drawImage(dc, 0, 0); }
  W = window.innerWidth; H = window.innerHeight;
  stage.width = dc.width = Math.floor(W * DPR);
  stage.height = dc.height = Math.floor(H * DPR);
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  jbuf.width = jbuf.height = Math.floor(JB * DPR);
  view.setTransform(DPR, 0, 0, DPR, 0, 0);
  dctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (keep.width) dctx.drawImage(keep, 0, 0, keep.width / DPR, keep.height / DPR);
}
window.addEventListener('resize', resize);
resize();
const grain = document.createElement('canvas'); grain.width = grain.height = 128;
{
  const g = grain.getContext('2d'), id = g.createImageData(128, 128);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = Math.random() * 255;
    id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 26;
  }
  g.putImageData(id, 0, 0);
}
const mouse = { x: W * 0.5, y: H * 0.5, px: W * 0.5, py: H * 0.5, vx: 0, vy: 0,
                alive: true, hp: MAXHP, inside: true, tilt: 0, flash: 0, fade: 1 };
const renn = { x: -120, y: H * 0.5, vx: 0, vy: 0, face: 1, state: 'chase', t: 0, cool: 0,
               walk: 0, knife: 0.35, tilt: 0, dashCd: 1.4, dashA: 0, combo: 0,
               bloody: 0, gore: 0, hop: 0, twitch: 0, twitchT: 2, glitch: 0, blinkTp: 8, eyeGlow: 0,
               sit: 0, tx: 0, ty: 0, searchT: 0, gx: 0, gy: 0, look: 0 };
const corpse = { x: 0, y: 0 };
const lastSeen = { x: W * 0.5, y: H * 0.5 };
let stars = [], blood = [], puffs = [];
let shake = 0, time = 0, starT = 0, deadT = 0, flicker = 0;
window.addEventListener('pointermove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.inside = true;
  lastSeen.x = mouse.x; lastSeen.y = mouse.y;
}, { passive: true });
document.addEventListener('mouseleave', () => { mouse.inside = false; lastSeen.x = mouse.x; lastSeen.y = mouse.y; });
document.addEventListener('mouseenter', () => mouse.inside = true);
window.addEventListener('blur', () => mouse.inside = false);
const mkStar = (x, y, vx, vy) => ({ x, y, vx, vy, r: rand(5, 14), rot: rand(0, TAU), vr: rand(-4, 4),
                                    life: 0, max: rand(0.55, 1.15), c: pick(SCENE) });
function spawnBlood(x, y, n, power, dir) {
  for (let i = 0; i < n; i++) {
    const a = dir !== undefined ? dir + rand(-1.5, 1.5) : rand(0, TAU);
    const s = rand(60, 430) * power;
    blood.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - rand(40, 200),
                 r: rand(1.6, 5.4), life: 0, max: rand(0.35, 1.0) });
  }
}
function splat(x, y, r, alpha) {
  dctx.save(); dctx.globalAlpha = alpha;
  const g = dctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, '#9e0016'); g.addColorStop(0.6, '#6f0011'); g.addColorStop(1, '#3a0009');
  dctx.fillStyle = g;
  dctx.beginPath();
  const pts = 9 + (Math.random() * 5 | 0);
  for (let i = 0; i <= pts; i++) {
    const a = i / pts * TAU, rr2 = r * rand(0.55, 1.15);
    const px = x + Math.cos(a) * rr2, py = y + Math.sin(a) * rr2;
    i ? dctx.lineTo(px, py) : dctx.moveTo(px, py);
  }
  dctx.closePath(); dctx.fill();
  if (r > 6) for (let i = 0; i < 4; i++) {
    const a = rand(0, TAU), d = r * rand(1.2, 2.6);
    dctx.beginPath(); dctx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, rand(1, 3.4), 0, TAU); dctx.fill();
  }
  dctx.restore();
}
function predict() {
  if (!mouse.alive) return { x: mouse.x, y: mouse.y };
  const d = Math.hypot(mouse.x - renn.x, mouse.y - renn.y) || 1;
  const t = clamp(d / SPD, 0, 0.6) * LEAD;
  return { x: clamp(mouse.x + mouse.vx * t, 8, W - 8),
           y: clamp(mouse.y + mouse.vy * t, 8, H - 8) };
}
function steer(tx, ty, dt, spd) {
  const dx = tx - renn.x, dy = ty - renn.y, d = Math.hypot(dx, dy) || 1;
  const slow = d < 70 ? 0.55 : 1;
  const k = 1 - Math.exp(-ACC * dt);
  renn.vx = lerp(renn.vx, dx / d * spd * slow, k);
  renn.vy = lerp(renn.vy, dy / d * spd * slow, k);
}
function doHit() {
  const d = Math.hypot(mouse.x - renn.x, mouse.y - renn.y);
  if (mouse.alive && mouse.inside && d < STAB_RANGE * 1.6) {
    mouse.hp--; renn.combo++; renn.bloody = 1; renn.gore = Math.min(1, renn.gore + 0.16);
    mouse.flash = 1; renn.eyeGlow = 1;
    const dir = Math.atan2(mouse.y - renn.y, mouse.x - renn.x);
    spawnBlood(mouse.x + 4, mouse.y + 10, 22 + renn.combo * 2, 1, dir);
    splat(mouse.x + rand(-8, 8), mouse.y + rand(0, 16), rand(5, 11), 0.85);
    shake = Math.min(32, shake + 9 + renn.combo * 1.5);
    flicker = 0.06;
    mouse.tilt += rand(-0.24, 0.24);
    if (mouse.hp <= 0) die();
  } else {
    renn.combo = 0;
    for (let i = 0; i < 8; i++) puffs.push({ x: renn.x + rand(-14, 14), y: renn.y + rand(0, 26), r: rand(3, 9), life: 0, max: 0.45 });
    shake = Math.min(20, shake + 3);
  }
}
function die() {
  mouse.alive = false; deadT = 0; shake = 44; flicker = 0.25;
  corpse.x = mouse.x; corpse.y = mouse.y;
  spawnBlood(corpse.x, corpse.y, 140, 1.7);
  for (let i = 0; i < 8; i++) splat(corpse.x + rand(-36, 36), corpse.y + rand(-16, 42), rand(10, 32), 0.9);
  for (let i = 0; i < 34; i++) stars.push(mkStar(renn.x, renn.y, rand(-230, 230), rand(-270, 40)));
  renn.state = 'gloat'; renn.t = 0;
}
function update(dt) {
  time += dt;
  const nvx = (mouse.x - mouse.px) / dt, nvy = (mouse.y - mouse.py) / dt;
  mouse.vx = lerp(mouse.vx, nvx, 0.35); mouse.vy = lerp(mouse.vy, nvy, 0.35);
  mouse.px = mouse.x; mouse.py = mouse.y;
  mouse.flash = Math.max(0, mouse.flash - dt * 3);
  mouse.tilt *= 1 - dt * 1.4;
  const wantFade = (mouse.alive && mouse.inside) ? 1 : 0;
  mouse.fade += (wantFade - mouse.fade) * Math.min(1, dt * 9);
  flicker = Math.max(0, flicker - dt);
  const j = renn;
  j.t += dt; j.cool -= dt; j.dashCd -= dt; j.blinkTp -= dt;
  j.eyeGlow = Math.max(0, j.eyeGlow - dt * 1.6);
  j.glitch = Math.max(0, j.glitch - dt);
  j.twitchT -= dt;
  if (j.twitchT <= 0) { j.twitchT = rand(1.4, 4.2); j.twitch = rand(0.12, 0.22); }
  j.twitch = Math.max(0, j.twitch - dt);
  const dist = Math.hypot(mouse.x - j.x, mouse.y - j.y);
  if (mouse.alive && !mouse.inside && (j.state === 'chase' || j.state === 'dash')) {
    j.state = 'search'; j.t = 0; j.searchT = 0; j.tx = lastSeen.x; j.ty = lastSeen.y;
  }
  if (j.state === 'search' && mouse.inside) { j.state = 'chase'; j.t = 0; j.glitch = 0.16; j.eyeGlow = 1; }
  if (mouse.alive && mouse.inside && dist > 620 && j.blinkTp <= 0 && j.state === 'chase') {
    j.glitch = 0.22;
    const a = Math.atan2(j.y - mouse.y, j.x - mouse.x) + rand(-0.7, 0.7);
    j.x = clamp(mouse.x + Math.cos(a) * rand(230, 330), 20, W - 20);
    j.y = clamp(mouse.y + Math.sin(a) * rand(230, 330), 30, H - 20);
    j.blinkTp = rand(7, 14); flicker = 0.05;
  }
  switch (j.state) {
    case 'chase': {
      const p = predict();
      steer(p.x, p.y, dt, SPD);
      j.gx = mouse.x; j.gy = mouse.y;
      j.knife = lerp(j.knife, 0.35 + Math.sin(time * 8) * 0.12, dt * 8);
      if (mouse.alive && dist < STAB_RANGE && j.cool <= 0) { j.state = 'windup'; j.t = 0; }
      else if (mouse.alive && dist > 210 && dist < 700 && j.dashCd <= 0 && Math.random() < dt * 1.5) {
        const p2 = predict(); j.dashA = Math.atan2(p2.y - j.y, p2.x - j.x); j.state = 'dash'; j.t = 0;
      }
      break;
    }
    case 'dash': {
      const p = predict();
      let diff = ((Math.atan2(p.y - j.y, p.x - j.x) - j.dashA + Math.PI * 3) % TAU) - Math.PI;
      j.dashA += diff * Math.min(1, dt * 3.4);
      j.vx = Math.cos(j.dashA) * DASH; j.vy = Math.sin(j.dashA) * DASH;
      j.knife = lerp(j.knife, -1.0, dt * 10);
      for (let i = 0; i < 2; i++) stars.push(mkStar(j.x - j.vx * 0.03, j.y + rand(-10, 20), rand(-60, 60), rand(-90, 10)));
      if (dist < STAB_RANGE * 1.1 && mouse.alive) { j.state = 'windup'; j.t = 0; }
      else if (j.t > 0.3) { j.state = 'chase'; j.dashCd = rand(1.0, 2.1); }
      break;
    }
    case 'windup': {
      j.vx *= Math.pow(0.02, dt); j.vy *= Math.pow(0.02, dt);
      j.knife = lerp(j.knife, -2.4, dt * 16);
      j.tilt = lerp(j.tilt, -0.18, dt * 10);
      j.eyeGlow = Math.max(j.eyeGlow, 0.5);
      shake = Math.max(shake, 2.5 + j.combo * 0.4);
      if (j.t > 0.14) { j.state = 'strike'; j.t = 0; j.hitDone = false; }
      break;
    }
    case 'strike': {
      j.knife = lerp(j.knife, 1.2, dt * 34);
      j.tilt = lerp(j.tilt, 0.26, dt * 22);
      const a = Math.atan2(mouse.y - j.y, mouse.x - j.x);
      j.x += Math.cos(a) * 270 * dt; j.y += Math.sin(a) * 270 * dt;
      if (!j.hitDone && j.t > 0.05) { j.hitDone = true; doHit(); }
      if (j.t > 0.16) { j.state = 'recover'; j.t = 0; }
      break;
    }
    case 'recover': {
      j.vx *= Math.pow(0.05, dt); j.vy *= Math.pow(0.05, dt);
      j.knife = lerp(j.knife, 0.4, dt * 9);
      j.tilt = lerp(j.tilt, 0, dt * 9);
      if (j.t > STABCD) { j.state = mouse.alive ? 'chase' : 'gloat'; j.t = 0; j.cool = 0.02; }
      break;
    }
    case 'search': {
      j.searchT -= dt;
      j.gx = j.tx; j.gy = j.ty;
      const d2 = Math.hypot(j.tx - j.x, j.ty - j.y);
      if (d2 < 46 || j.searchT <= 0) {
        j.searchT = rand(1.1, 2.8);
        j.tx = clamp(lastSeen.x + rand(-320, 320), 40, W - 40);
        j.ty = clamp(lastSeen.y + rand(-250, 250), 50, H - 50);
        j.look = rand(0.5, 1.1);
      }
      j.look = Math.max(0, j.look - dt);
      if (j.look > 0) {
        j.vx *= Math.pow(0.05, dt); j.vy *= Math.pow(0.05, dt);
        if (Math.random() < dt * 1.6) j.face *= -1;
        j.gx = j.x + j.face * 200; j.gy = j.y + rand(-30, 30);
      } else {
        steer(j.tx, j.ty, dt, 165);
      }
      j.knife = lerp(j.knife, 1.25 + Math.sin(time * 1.4) * 0.14, dt * 4);
      j.tilt = lerp(j.tilt, Math.sin(time * 0.9) * 0.06, dt * 3);
      break;
    }
    case 'gloat': {
      deadT += dt;
      steer(corpse.x - 44, corpse.y - 8, dt, 150);
      j.gx = corpse.x; j.gy = corpse.y;
      j.hop = Math.abs(Math.sin(time * 5)) * 9;
      j.knife = lerp(j.knife, 0.95 + Math.sin(time * 3) * 0.4, dt * 6);
      if (Math.random() < dt * 1.1) {
        splat(corpse.x + rand(-26, 26), corpse.y + rand(-8, 28), rand(4, 13), 0.6);
        spawnBlood(corpse.x, corpse.y + 8, 10, 0.7);
        shake = Math.max(shake, 6);
      }
      if (Math.random() < dt * 2.5) stars.push(mkStar(j.x + rand(-30, 30), j.y + rand(-40, 10), rand(-40, 40), rand(-90, -20)));
      if (deadT > 3.4) { j.state = 'calm'; j.t = 0; }
      break;
    }
    case 'calm': {
      const sx2 = corpse.x - 62 * (corpse.x > W * 0.5 ? 1 : -1), sy2 = corpse.y - 4;
      deadT += dt;
      const d3 = Math.hypot(sx2 - j.x, sy2 - j.y);
      if (d3 > 26 && j.sit < 0.05 && j.t < 4) steer(sx2, sy2, dt, 105);
      else { j.vx *= Math.pow(0.02, dt); j.vy *= Math.pow(0.02, dt); j.sit = Math.min(1, j.sit + dt * 1.1); }
      j.knife = lerp(j.knife, 1.62, dt * 2.5);
      j.tilt = lerp(j.tilt, 0.05 * (corpse.x > j.x ? 1 : -1), dt * 2);
      if (j.sit > 0.9 && Math.random() < dt * 0.35) { j.look = rand(1.5, 3); }
      j.look = Math.max(0, j.look - dt);
      j.gx = j.look > 0 ? j.x + j.face * 40 : corpse.x;
      j.gy = j.look > 0 ? j.y - 120 : corpse.y;
      if (deadT < 26 && Math.random() < dt * 0.25) spawnBlood(corpse.x + rand(-6, 6), corpse.y + 6, 2, 0.25);
      break;
    }
  }
  if (j.state === 'dash' || j.state === 'windup' || j.state === 'strike' || j.state === 'recover') {
    j.gx = mouse.x; j.gy = mouse.y;
  }
  if (j.state !== 'gloat') j.hop = lerp(j.hop, 0, dt * 8);
  j.x += j.vx * dt; j.y += j.vy * dt;
  j.x = clamp(j.x, 26, W - 26); j.y = clamp(j.y, 40, H - 26);
  const sp = Math.hypot(j.vx, j.vy);
  if (Math.abs(j.vx) > 12) j.face = j.vx > 0 ? 1 : -1;
  j.walk += dt * (4 + sp * 0.045);
  if (j.state === 'chase' || j.state === 'dash') j.tilt = lerp(j.tilt, clamp(j.vx / 900, -0.2, 0.2), dt * 6);
  j.bloody = Math.max(j.gore * 0.7, j.bloody - dt * 0.05);
  if (sp > 55) {
    starT -= dt;
    if (starT <= 0) {
      starT = 0.038;
      const n = j.state === 'dash' ? 3 : 1;
      for (let i = 0; i < n; i++)
        stars.push(mkStar(j.x - j.vx / sp * 20 + rand(-12, 12), j.y + rand(-18, 26),
                          -j.vx * 0.1 + rand(-40, 40), rand(-70, -8)));
    }
  }
  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i]; s.life += dt;
    s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 22 * dt; s.rot += s.vr * dt; s.vx *= 1 - dt * 0.8;
    if (s.life > s.max) stars.splice(i, 1);
  }
  for (let i = blood.length - 1; i >= 0; i--) {
    const b = blood[i]; b.life += dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.vy += 1500 * dt; b.vx *= 1 - dt * 1.2;
    const floor = b.y > H - 2;
    if (b.life > b.max || floor) { splat(b.x, floor ? H - 2 : b.y, b.r * rand(0.8, 1.7), 0.55); blood.splice(i, 1); }
  }
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i]; p.life += dt; p.y -= 40 * dt; p.r += 22 * dt;
    if (p.life > p.max) puffs.splice(i, 1);
  }
  shake = Math.max(0, shake - dt * (28 + shake * 1.6));
}
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function sparkle(x, y, r, rot, c, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = a;
  ctx.fillStyle = c; ctx.shadowColor = c; ctx.shadowBlur = 16;
  ctx.beginPath(); ctx.moveTo(0, -r);
  ctx.quadraticCurveTo(0, 0, r, 0); ctx.quadraticCurveTo(0, 0, 0, r);
  ctx.quadraticCurveTo(0, 0, -r, 0); ctx.quadraticCurveTo(0, 0, 0, -r);
  ctx.fill(); ctx.restore();
}
function drawKnife(bloody) {
  ctx.fillStyle = '#241b29'; rr(-3, -4, 12, 8, 3); ctx.fill();
  ctx.fillStyle = '#3d3045'; rr(8, -5, 4, 10, 2); ctx.fill();
  const g = ctx.createLinearGradient(12, -5, 44, 5);
  g.addColorStop(0, '#e8ecf5'); g.addColorStop(0.5, '#aab2c4'); g.addColorStop(1, '#ffffff');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(12, -5); ctx.lineTo(38, -3.6); ctx.lineTo(45, 0.4); ctx.lineTo(12, 4.8);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#7a8298'; ctx.lineWidth = 0.9; ctx.stroke();
  if (bloody > 0.02) {
    ctx.globalAlpha = clamp(bloody, 0, 1); ctx.fillStyle = '#8d0016';
    ctx.beginPath(); ctx.moveTo(22, -3.4); ctx.lineTo(38, -2.6); ctx.lineTo(45, 0.4); ctx.lineTo(22, 3.6);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(42, 4 + Math.sin(time * 4) * 1.6, 1.8, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
}
function drawrenn() {
  const j = renn;
  const sp = Math.hypot(j.vx, j.vy);
  const w = clamp(sp / 150, 0, 1);
  const sit = j.sit;
  const tw = j.twitch > 0 ? rand(-2.2, 2.2) : 0;
  const bob = Math.sin(j.walk * 2) * 2.4 * w - j.hop + sit * (10 + Math.sin(time * 1.3) * 1.6);
  const swing = Math.sin(j.walk) * 7 * w;
  ctx.save();
  ctx.translate(j.x + tw, j.y);
  const sh = ctx.createRadialGradient(0, 26, 2, 0, 26, 54);
  sh.addColorStop(0, 'rgba(0,0,0,.62)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sh; ctx.beginPath(); ctx.ellipse(0, 30, 50, 26, 0, 0, TAU); ctx.fill();
  ctx.scale(j.face * SCALE, SCALE);
  ctx.rotate(j.tilt + (j.twitch > 0 ? rand(-0.05, 0.05) : 0));
  ctx.translate(0, bob);
  const flow = clamp(sp / 420, 0, 1);
  ctx.fillStyle = '#0b0810';
  for (let i = 0; i < 11; i++) {
    const a = -2.7 + i * 0.36;
    const bx = Math.cos(a) * 22, by = Math.sin(a) * 22 - 12;
    const L = 34 + (i % 4) * 15 + flow * 30;
    const wob = Math.sin(time * (4 + i * 0.5) + i * 1.3) * (5 + flow * 8);
    ctx.beginPath();
    ctx.moveTo(bx * 0.5, by * 0.5);
    ctx.quadraticCurveTo(bx - 18 - flow * 14, by + 6 + wob, bx - L, by + L * 0.5 + wob * 1.4);
    ctx.quadraticCurveTo(bx - 12, by + 18, bx * 0.5 + 6, by * 0.5 + 11);
    ctx.closePath(); ctx.fill();
  }
  ctx.beginPath(); ctx.ellipse(-2, -13, 31, 32, 0, 0, TAU); ctx.fill();

  // legs (bare, under the dress)
  ctx.fillStyle = '#c8b8b0';
  if (sit > 0.5) {
    rr(-2, 28, 28, 8, 4); ctx.fill();
    rr(-4, 34, 24, 8, 4); ctx.fill();
  } else {
    rr(-10 + swing * 0.5, 28, 8, 16, 4); ctx.fill();
    rr(2 - swing * 0.5, 28, 8, 16, 4); ctx.fill();
  }

  // white dress - torso
  const dressGrad = ctx.createLinearGradient(0, 0, 0, 45);
  dressGrad.addColorStop(0, '#f8f4f0');
  dressGrad.addColorStop(0.4, '#f0e8e0');
  dressGrad.addColorStop(1, '#e8dcd0');
  ctx.fillStyle = dressGrad;
  rr(-17, 1, 34, 26, 12); ctx.fill();
  ctx.strokeStyle = '#d0c4b8'; ctx.lineWidth = 1; ctx.stroke();

  // white dress - skirt (long, old style)
  ctx.fillStyle = dressGrad;
  ctx.beginPath();
  ctx.moveTo(-18, 22);
  ctx.quadraticCurveTo(-24, 30, -30, 48);
  ctx.lineTo(30, 48);
  ctx.quadraticCurveTo(24, 30, 18, 22);
  ctx.closePath();
  ctx.fill();

  // subtle old fabric folds
  ctx.strokeStyle = 'rgba(180,160,140,0.35)';
  ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.moveTo(-10, 24); ctx.quadraticCurveTo(-14, 36, -16, 47); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 24); ctx.lineTo(0, 47); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10, 24); ctx.quadraticCurveTo(14, 36, 16, 47); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-5, 26); ctx.quadraticCurveTo(-7, 38, -8, 46); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5, 26); ctx.quadraticCurveTo(7, 38, 8, 46); ctx.stroke();

  // permanent old blood stains on the white dress
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-18, 22);
  ctx.quadraticCurveTo(-24, 30, -30, 48);
  ctx.lineTo(30, 48);
  ctx.quadraticCurveTo(24, 30, 18, 22);
  ctx.closePath();
  ctx.clip();

  // dried blood stains
  ctx.globalAlpha = 0.72;
  ctx.fillStyle = '#6a0010';
  // large stains
  ctx.beginPath(); ctx.ellipse(-6, 32, 9, 7, -0.4, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(8, 38, 11, 8, 0.3, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-12, 42, 7, 5, 0.6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(3, 28, 6, 4.5, -0.2, 0, TAU); ctx.fill();
  // smaller splatters
  ctx.fillStyle = '#8a0014';
  for (let i = 0; i < 9; i++) {
    const px = -18 + ((i * 41) % 36);
    const py = 26 + ((i * 29) % 20);
    ctx.beginPath();
    ctx.ellipse(px, py, 2.2 + (i % 3), 1.8 + (i % 2) * 1.5, i * 0.7, 0, TAU);
    ctx.fill();
  }
  // drip lines
  ctx.strokeStyle = '#5a000c';
  ctx.lineWidth = 1.8;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-4, 30); ctx.quadraticCurveTo(-5, 40, -3, 47); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10, 35); ctx.quadraticCurveTo(12, 42, 9, 47); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2, 27); ctx.lineTo(1, 36); ctx.stroke();
  ctx.restore();

  // dynamic gore from combat (on top of permanent stains)
  if (j.gore > 0.01) {
    ctx.save();
    rr(-17, 1, 34, 26, 12); ctx.clip();
    ctx.globalAlpha = clamp(j.gore, 0, 0.95);
    ctx.fillStyle = '#7c0013';
    for (let i = 0; i < 8; i++) {
      const px = -14 + ((i * 37) % 28), py = 5 + ((i * 53) % 20);
      ctx.beginPath(); ctx.ellipse(px, py, 2.5 + (i % 3) * 2.2, 3 + (i % 2) * 3.2, i, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  // collar / neckline
  ctx.fillStyle = '#f5f0ea';
  ctx.beginPath(); ctx.arc(0, 21, 7.5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.fill();
  ctx.strokeStyle = '#d8ccc0'; ctx.lineWidth = 1; ctx.stroke();

  // arms
  ctx.strokeStyle = '#ddd4d8'; ctx.lineWidth = 6.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-11, 8); ctx.lineTo(-21 - swing * 0.4, 20); ctx.stroke();
  ctx.save();
  ctx.translate(13, 9); ctx.rotate(j.knife);
  ctx.strokeStyle = '#e6dee1'; ctx.lineWidth = 6.5;
  ctx.beginPath(); ctx.moveTo(-10, -2); ctx.lineTo(0, 0); ctx.stroke();
  ctx.fillStyle = '#efe8e6'; ctx.beginPath(); ctx.arc(0, 0, 4.6, 0, TAU); ctx.fill();
  drawKnife(j.bloody);
  ctx.restore();

  // head
  const hg = ctx.createRadialGradient(-7, -27, 3, 0, -16, 34);
  hg.addColorStop(0, '#fffcfa'); hg.addColorStop(0.62, '#ece1dc'); hg.addColorStop(1, '#c0b2b6');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.ellipse(0, -16, 26, 25, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 0.35; ctx.fillStyle = '#6d5f6c';
  ctx.beginPath(); ctx.ellipse(-18, -10, 6, 8, 0.3, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(17, -10, 6, 8, -0.3, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#0b0810';
  ctx.beginPath();
  ctx.moveTo(-27, -16);
  ctx.quadraticCurveTo(-23, -46, 2, -44);
  ctx.quadraticCurveTo(25, -43, 27, -14);
  ctx.quadraticCurveTo(20, -25, 12, -17);
  ctx.quadraticCurveTo(5, -30, -2, -19);
  ctx.quadraticCurveTo(-10, -32, -17, -18);
  ctx.quadraticCurveTo(-22, -27, -27, -16);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 0.92;
  ctx.beginPath(); ctx.moveTo(-8, -38); ctx.quadraticCurveTo(-13, -18, -6, -2);
  ctx.lineTo(-2, -4); ctx.quadraticCurveTo(-8, -20, -4, -38); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(15, -38); ctx.quadraticCurveTo(21, -20, 14, -4);
  ctx.lineTo(10, -6); ctx.quadraticCurveTo(17, -21, 11, -38); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
  const lx = (j.gx - j.x) * j.face, ly = j.gy - (j.y - 16);
  const la = Math.atan2(ly, lx), ld = clamp(Math.hypot(lx, ly) / 260, 0, 1);
  const eyes = [[-10, -17], [10, -17]];
  for (const [ex, ey] of eyes) {
    ctx.fillStyle = 'rgba(58,10,38,.5)';
    ctx.beginPath(); ctx.ellipse(ex, ey + 1, 10.6, 11.6, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#050308';
    ctx.beginPath(); ctx.ellipse(ex, ey, 7.8, 9.6, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(150,10,30,' + (0.55 + j.eyeGlow * 0.45) + ')'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.ellipse(ex, ey, 7.8, 9.6, 0, 0, TAU); ctx.stroke();
    const px = ex + Math.cos(la) * 3.1 * ld, py = ey + Math.sin(la) * 3.6 * ld;
    ctx.shadowColor = '#ff2d55'; ctx.shadowBlur = 8 + j.eyeGlow * 22;
    ctx.fillStyle = j.eyeGlow > 0.1 ? '#ff5570' : '#fff2f5';
    ctx.beginPath(); ctx.arc(px, py, 2.5 + j.eyeGlow * 1.2, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(120,0,18,.75)';
    ctx.beginPath(); ctx.moveTo(ex - 1.6, ey + 9);
    ctx.quadraticCurveTo(ex, ey + 17 + Math.sin(time * 2 + ex) * 2, ex + 1.6, ey + 9);
    ctx.closePath(); ctx.fill();
  }
  const grin = 1 + (j.state === 'strike' || j.state === 'windup' ? 0.42 : 0);
  ctx.fillStyle = '#12050a';
  ctx.beginPath();
  ctx.moveTo(-19, -5);
  ctx.quadraticCurveTo(0, 19 * grin, 19, -5);
  ctx.quadraticCurveTo(0, 3, -19, -5);
  ctx.closePath(); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = '#4a0410'; ctx.beginPath(); ctx.ellipse(0, 12, 16, 9, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#e8dfd4';
  for (let i = -4; i <= 4; i++) {
    const x = i * 4.1 + (i % 2 ? 0.8 : -0.6);
    ctx.beginPath(); ctx.moveTo(x - 1.9, -4); ctx.lineTo(x + 1.9, -4);
    ctx.lineTo(x + (i % 3 ? 0.4 : -0.5), 2.4 + (i % 2) * 1.6); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(110,8,24,.9)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  for (let i = -3; i <= 3; i++) {
    const t = (i + 3) / 6, px = lerp(-21, 21, t);
    const py = -5 + Math.sin(t * Math.PI) * 11 * grin;
    ctx.beginPath(); ctx.moveTo(px - 3, py - 3.6); ctx.lineTo(px + 3, py + 3.6); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(125,0,20,.85)';
  ctx.beginPath(); ctx.moveTo(-19, -5);
  ctx.quadraticCurveTo(-22, 6 + Math.sin(time * 1.7) * 2, -17, 3); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function draw() {
  ctx = view;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const sx = shake ? rand(-shake, shake) : 0, sy = shake ? rand(-shake, shake) : 0;
  ctx.translate(sx, sy);
  const bgd = Math.hypot(mouse.x - renn.x, mouse.y - renn.y);
  const bg = ctx.createRadialGradient(W * 0.5, H * 0.45, 0, W * 0.5, H * 0.45, Math.max(W, H) * 0.75);
  bg.addColorStop(0, '#3a0a0a'); bg.addColorStop(1, '#1a0505');
  ctx.fillStyle = bg; ctx.fillRect(-60, -60, W + 120, H + 120);
  ctx.drawImage(dc, 0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  for (const s of stars) {
    const t = s.life / s.max, a = (1 - t) * (t < 0.15 ? t / 0.15 : 1);
    sparkle(s.x, s.y, s.r * (0.6 + 0.6 * (1 - t)), s.rot, s.c, a * 0.95);
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.shadowBlur = 0;
  for (const p of puffs) {
    ctx.globalAlpha = (1 - p.life / p.max) * 0.3; ctx.fillStyle = '#9a89ab';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  jbx.setTransform(DPR, 0, 0, DPR, 0, 0);
  jbx.clearRect(0, 0, JB, JB);
  ctx = jbx;
  jbx.save(); jbx.translate(JB / 2 - renn.x, JB / 2 - renn.y); drawrenn(); jbx.restore();
  ctx = view;
  const jx = renn.x - JB / 2, jy = renn.y - JB / 2;
  if (renn.glitch > 0) {
    ctx.globalAlpha = 0.85;
    for (let y = 0; y < JB; y += 7) {
      const off = Math.random() < 0.55 ? rand(-18, 18) : 0;
      ctx.drawImage(jbuf, 0, y * DPR, jbuf.width, 7 * DPR, jx + off, jy + y, JB, 7);
    }
    ctx.globalAlpha = 0.3;
    ctx.drawImage(jbuf, jx + rand(-6, 6), jy + rand(-3, 3), JB, JB);
    ctx.globalAlpha = 1;
  } else {
    ctx.drawImage(jbuf, jx, jy, JB, JB);
  }
  drawCursor();
  for (const b of blood) {
    ctx.globalAlpha = clamp(1 - b.life / b.max + 0.25, 0, 1);
    ctx.fillStyle = '#a80019';
    ctx.beginPath();
    ctx.ellipse(b.x, b.y, b.r, b.r * (1 + Math.min(1.4, Math.abs(b.vy) / 700)), Math.atan2(b.vy, b.vx), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  const danger = mouse.alive ? clamp((260 - bgd) / 260, 0, 1) * 0.55 + (1 - mouse.hp / MAXHP) * 0.3
                             : 0.5 * (1 - renn.sit) + 0.12;
  const pulse = Math.sin(time * 1.6) * 0.03;
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(' + (30 + danger * 100 | 0) + ',0,10,' + Math.min(0.8, 0.3 + danger * 0.42) + ')');
  ctx.fillStyle = vg; ctx.fillRect(-60, -60, W + 120, H + 120);
  if (danger > 0.05) {
    ctx.fillStyle = 'rgba(105,0,18,' + (danger * 0.1 + pulse * danger) + ')';
    ctx.fillRect(-60, -60, W + 120, H + 120);
  }
  ctx.save();
  ctx.globalAlpha = 0.5;
  const gx = -rand(0, 128), gy = -rand(0, 128);
  const pat = ctx.createPattern(grain, 'repeat');
  ctx.translate(gx, gy); ctx.fillStyle = pat; ctx.fillRect(0, 0, W + 128, H + 128);
  ctx.restore();
  if (flicker > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.07) + ')';
    ctx.fillRect(-60, -60, W + 120, H + 120);
  }
}
function cursorPath() {
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(0, 19); ctx.lineTo(4.6, 14.6); ctx.lineTo(7.8, 21.4);
  ctx.lineTo(11.4, 19.7); ctx.lineTo(8.3, 13.2); ctx.lineTo(14.2, 12.8);
  ctx.closePath();
}
function drawCursor() {
  if (!mouse.alive || mouse.fade < 0.02) return;
  const dmg = 1 - mouse.hp / MAXHP;
  ctx.save();
  ctx.globalAlpha = mouse.fade;
  ctx.translate(mouse.x, mouse.y);
  ctx.rotate(mouse.tilt);
  if (mouse.flash > 0) ctx.translate(rand(-3, 3) * mouse.flash, rand(-3, 3) * mouse.flash);
  cursorPath();
  ctx.fillStyle = mouse.flash > 0.35 ? '#ffd9e2' : '#ffffff';
  ctx.fill();
  ctx.lineJoin = 'round'; ctx.lineWidth = 1.7; ctx.strokeStyle = '#0d0710'; ctx.stroke();
  if (dmg > 0) {
    ctx.save(); ctx.clip();
    ctx.strokeStyle = '#7d0014'; ctx.lineWidth = 1.3;
    const cracks = [[1,4,6,9],[2,10,7,7],[3,7,9,14],[1,13,6,17],[4,3,2,11],[6,12,10,16],[2,6,8,12]];
    const n = Math.min(cracks.length, Math.round(dmg * cracks.length + 0.3));
    for (let i = 0; i < n; i++) { const c = cracks[i]; ctx.beginPath(); ctx.moveTo(c[0], c[1]); ctx.lineTo(c[2], c[3]); ctx.stroke(); }
    ctx.fillStyle = 'rgba(150,0,22,' + (0.1 + dmg * 0.34) + ')';
    ctx.beginPath(); ctx.rect(0, 8 + (1 - dmg) * 11, 20, 20); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#8d0016';
    const drip = (time * 30) % 26;
    if (dmg > 0.3) { ctx.beginPath(); ctx.arc(6.5, 19 + drip * 0.35, 1.6 + dmg, 0, TAU); ctx.fill(); }
    if (dmg > 0.6) { ctx.beginPath(); ctx.arc(2.5, 15 + ((drip + 12) % 26) * 0.3, 1.4 + dmg, 0, TAU); ctx.fill(); }
  }
  ctx.restore();
}
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  update(Math.min(dt, 0.05));
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
